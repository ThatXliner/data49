name: Verified Selenium Manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin-x86_64
            executable: selenium-manager
          - os: windows-latest
            platform: win32-x86_64
            executable: selenium-manager.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SeleniumHQ/selenium
          ref: 35c5fab4a58fa5878edb255eb7747b04ca51a015
          path: selenium-source
          persist-credentials: false
      - name: Apply security patch
        run: git -C selenium-source apply ../vendor/selenium-manager/security.patch
      - name: Build locked native downloader
        run: cargo build --manifest-path selenium-source/rust/Cargo.toml --release --locked
      - name: Preserve built executable
        uses: actions/upload-artifact@v4
        with:
          name: selenium-manager-${{ matrix.platform }}
          path: selenium-source/rust/target/release/${{ matrix.executable }}
